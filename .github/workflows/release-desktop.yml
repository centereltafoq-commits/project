name: Build and Publish Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Portable PostgreSQL 16
        run: npm run prepare:postgres --workspace=@edu-center/desktop

      - name: Build Shared, API, Web, and Desktop
        run: npm run build && npm run build:desktop

      - name: Stage Runtime & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          SUPABASE_SYNC_URL: ${{ secrets.SUPABASE_SYNC_URL }}
          SUPABASE_SYNC_KEY: ${{ secrets.SUPABASE_SYNC_KEY }}
          SUPABASE_SYNC_BUCKET: ${{ secrets.SUPABASE_SYNC_BUCKET }}
        run: npm run stage --workspace=@edu-center/desktop && npx --workspace=@edu-center/desktop electron-builder --win --x64 --publish always
